# PostgreSQL 16 with a fixed, recorded configuration (see README "Measurement setup").
# Host port 5433 so it does not collide with a locally installed Postgres on 5432.
services:
  postgres:
    image: postgres:16
    container_name: steerdb-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: steerdb
      POSTGRES_DB: imdb
    ports:
      - "5433:5432"
    shm_size: 2gb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/raw:/data/raw:ro
      - ./workload/job:/workload/job:ro
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=64MB
      - -c
      - effective_cache_size=4GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - jit=off
      - -c
      - random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imdb"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
