[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steerdb"
version = "0.1.0"
description = "A learned hint-set steering layer on top of the PostgreSQL optimizer (Bao-style)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Reema Sarkar" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "lightgbm>=4.0",
    "psycopg[binary]>=3.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
steerdb = "steerdb.cli:main"

[tool.setuptools.packages.find]
include = ["steerdb*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
